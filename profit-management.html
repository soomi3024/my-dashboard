<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>월별 손익관리</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;background:#f5f6f8;font-family:Arial,sans-serif;color:#222}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #0001}h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:13px;color:#666;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}.btn{padding:12px 18px;border:0;border-radius:9px;background:#222;color:#fff;font-weight:700}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{padding:14px;background:#f7f8fa;border-radius:10px}.mini span{display:block;font-size:12px;color:#777}.mini strong{font-size:18px}@media(max-width:650px){.grid,.summary{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="card"><h1>💰 월별 손익관리</h1><p style="color:#777">비용은 실제 지급일이 아니라 해당 비용이 발생한 월 기준으로 입력하세요.</p><div class="grid"><div class="field"><label>월</label><input id="month" type="month"></div><div class="field"><label>매출</label><input id="sales" type="number" placeholder="0"></div><div class="field"><label>물류비</label><input id="logistics" type="number" placeholder="0"></div><div class="field"><label>인건비</label><input id="labor" type="number" placeholder="0"></div><div class="field"><label>임대료</label><input id="rent" type="number" placeholder="0"></div><div class="field"><label>공과금</label><input id="utilities" type="number" placeholder="0"></div><div class="field"><label>광고비</label><input id="ads" type="number" placeholder="0"></div><div class="field"><label>기타비용</label><input id="other" type="number" placeholder="0"></div></div><br><button class="btn" id="save">월별 손익 저장</button><span id="msg" style="margin-left:10px"></span></div><div class="card summary"><div class="mini"><span>최근 매출</span><strong id="lastSales">0원</strong></div><div class="mini"><span>최근 비용</span><strong id="lastCost">0원</strong></div><div class="mini"><span>최근 순이익</span><strong id="lastProfit">0원</strong></div><div class="mini"><span>순이익률</span><strong id="lastRate">0%</strong></div></div><div class="card"><h2>월별 순이익 비교</h2><canvas id="profitChart"></canvas></div></div><script>const sb=window.supabase.createClient('https://gvlfyzdswegwmmpzoabc.supabase.co','sb_publishable_Inp1yZHn3Qrqtzq1TWgUaw_AWxEgK5y');const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';const nums=['sales','logistics','labor','rent','utilities','ads','other'];let chart;function values(){const o={};nums.forEach(k=>o[k]=Number($(k).value||0));return o}async function load(){const {data,error}=await sb.from('monthly_profit').select('*').order('month',{ascending:true});if(error){$('msg').textContent='손익 테이블이 아직 없습니다. Supabase에 monthly_profit 테이블을 만들어주세요.';return}if(!data?.length)return;const d=data.map(x=>({...x,profit:Number(x.sales_amount||0)-['logistics','labor','rent','utilities','ads','other'].reduce((s,k)=>s+Number(x[k+'_amount']||0),0)}));const last=d[d.length-1],cost=last.sales_amount-last.profit;$('lastSales').textContent=money(last.sales_amount);$('lastCost').textContent=money(cost);$('lastProfit').textContent=money(last.profit);$('lastRate').textContent=(last.sales_amount?last.profit/last.sales_amount*100:0).toFixed(1)+'%';if(chart)chart.destroy();chart=new Chart($('profitChart'),{type:'line',data:{labels:d.map(x=>x.month),datasets:[{label:'매출',data:d.map(x=>x.sales_amount)},{label:'총비용',data:d.map(x=>x.sales_amount-x.profit)},{label:'순이익',data:d.map(x=>x.profit)}]},options:{responsive:true,scales:{y:{beginAtZero:true}}}})}$('save').onclick=async()=>{const month=$('month').value;if(!month){$('msg').textContent='월을 선택해주세요.';return}const v=values();const cost=v.logistics+v.labor+v.rent+v.utilities+v.ads+v.other;const row={month,sales_amount:v.sales,logistics_amount:v.logistics,labor_amount:v.labor,rent_amount:v.rent,utilities_amount:v.utilities,ads_amount:v.ads,other_amount:v.other,profit_amount:v.sales-cost,profit_rate:v.sales?(v.sales-cost)/v.sales*100:0};const {error}=await sb.from('monthly_profit').upsert(row,{onConflict:'month'});$('msg').textContent=error?'저장 오류: '+error.message:'저장되었습니다.';if(!error)load()};load();</script></body></html>
