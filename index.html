<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>더 타코부스 경영관리</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 24px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .amount {
      font-size: 28px;
      font-weight: bold;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .channel {
      font-weight: 600;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .error {
      background: #fff0f0;
      color: #c62828;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    @media (max-width: 700px) {
      .container {
        padding: 16px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .amount {
        font-size: 25px;
      }
    }
 
  .amount {
  font-size: 25px;
}

/* 여기부터 새로 추가 */
.deposit-form {
  margin: 20px 0;
  padding: 20px;
  background: #f8f9fa;
  border: 1px solid #ddd;
  border-radius: 12px;
}

.deposit-form h3 {
  margin-top: 0;
  margin-bottom: 16px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.form-grid input,
.form-grid select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 14px;
  background: white;
}

.deposit-form button {
  margin-top: 15px;
  padding: 12px 20px;
  border: 0;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.deposit-form button:hover {
  opacity: 0.85;
}

@media (max-width: 600px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
}

/* 새 CSS 끝 */

</style>
  
</head>

<script>

  let selectedProfitSales = 0;

async function loadProfitSales() {
  const month = document.getElementById("profitMonth").value;

  if (!month) {
    selectedProfitSales = 0;
    document.getElementById("profitSales").textContent = "0원";
    calculateMonthlyProfit();
    return;
  }

  const startDate = month + "-01";

  const nextMonth = new Date(startDate);
  nextMonth.setMonth(nextMonth.getMonth() + 1);

  const endDate =
    nextMonth.getFullYear() +
    "-" +
    String(nextMonth.getMonth() + 1).padStart(2, "0") +
    "-01";

  const { data, error } = await supabaseClient
    .from("sales")
    .select("amount")
    .gte("sale_date", startDate)
    .lt("sale_date", endDate);

  if (error) {
    alert("매출 데이터를 불러오지 못했습니다.");
    console.error(error);
    return;
  }

  selectedProfitSales = (data || []).reduce(
    (sum, row) => sum + Number(row.amount || 0),
    0
  );

  document.getElementById("profitSales").textContent =
    won(selectedProfitSales);

  calculateMonthlyProfit();
}

function calculateMonthlyProfit() {
  const sales = selectedProfitSales || 0;

  const logistics =
    Number(document.getElementById("profitLogistics").value || 0);

  const deliveryFee =
    Number(document.getElementById("profitDeliveryFee").value || 0);

  const cardFee =
    Number(document.getElementById("profitCardFee").value || 0);

  const advertising =
    Number(document.getElementById("profitAdvertising").value || 0);

  const royalty =
    Math.round(sales * 0.02 * 1.1);
  
  document.getElementById("profitRoyaltyBase").value =
  royalty;

  const gas =
    Number(document.getElementById("profitGas").value || 0);

  const utility =
    Number(document.getElementById("profitUtility").value || 0);

  const insurance =
    Number(document.getElementById("profitInsurance").value || 0);

  const labor =
    Number(document.getElementById("profitLabor").value || 0);

  const rent =
    Number(document.getElementById("profitRent").value || 0);

  const torder =
    Number(document.getElementById("profitTorder").value || 0);

  const pos =
    Number(document.getElementById("profitPos").value || 0);

  const accountant =
    Number(document.getElementById("profitTaxAccountant").value || 0);

  const otherFixed =
    Number(document.getElementById("profitOtherFixed").value || 0);

  const loanInterest =
    Number(document.getElementById("profitLoanInterest").value || 0);

  const other =
    Number(document.getElementById("profitOther").value || 0);

  const totalVariable =
    logistics +
    deliveryFee +
    cardFee +
    advertising +
    royalty +
    gas +
    utility +
    insurance;

  const totalFixed =
    labor +
    rent +
    torder +
    pos +
    accountant +
    otherFixed;

  const totalFinancial = loanInterest;

  const netProfit =
    sales -
    totalVariable -
    totalFixed -
    totalFinancial -
    other;

  const profitRate =
    sales > 0
      ? ((netProfit / sales) * 100).toFixed(1)
      : "0.0";

  document.getElementById("profitSales").textContent =
    won(sales);

  document.getElementById("profitVariableCost").textContent =
    won(totalVariable);

  document.getElementById("profitFixedCost").textContent =
    won(totalFixed);

  document.getElementById("profitFinancialCost").textContent =
    won(totalFinancial);

  document.getElementById("profitOtherCost").textContent =
    won(other);

  document.getElementById("profitNet").textContent =
    won(netProfit);

  document.getElementById("profitRate").textContent =
    profitRate + "%";
}

const profitInputIds = [
  "profitLogistics",
  "profitDeliveryFee",
  "profitCardFee",
  "profitAdvertising",
  "profitGas",
  "profitUtility",
  "profitInsurance",
  "profitLabor",
  "profitRent",
  "profitTorder",
  "profitPos",
  "profitTaxAccountant",
  "profitOtherFixed",
  "profitLoanInterest",
  "profitOther"
];

profitInputIds.forEach(id => {
  const element = document.getElementById(id);

  if (element) {
    element.addEventListener("input", calculateMonthlyProfit);
    element.addEventListener("change", calculateMonthlyProfit);
  }
});

const profitMonthInput =

if (profitMonthInput) {

    "change",
    loadProfitSales
  );
}

  

  // ==============================
  // Supabase 연결 정보
  // ==============================

  const SUPABASE_URL =
    "https://gvlfyzdswegwmmpzoabc.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Inp1yZHn3Qrqtzq1TWgUaw_AWxEgK5y";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ==============================
  // 숫자를 원화로 표시
  // ==============================

  function won(number) {
    return Number(number).toLocaleString("ko-KR") + "원";
  }


  // ==============================
  // 매출 데이터 불러오기
  // ==============================

  async function loadSales() {

    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const dashboard = document.getElementById("dashboard");

    try {

      const { data, error } = await supabaseClient
        .from("sales")
        .select("*")
        .order("sale_date", { ascending: false })
        .order("id", { ascending: false });

      if (error) {
        throw error;
      }

      if (!data || data.length === 0) {
        throw new Error("등록된 매출 데이터가 없습니다.");
      }


      // ==============================
      // 전체 매출
      // ==============================

      const total = data.reduce(
        (sum, row) => sum + Number(row.amount),
        0
      );


      // ==============================
      // 오늘 매출
      // ==============================

      const today = new Date()
        .toISOString()
        .split("T")[0];

      const todayTotal = data
        .filter(row => row.sale_date === today)
        .reduce(
          (sum, row) => sum + Number(row.amount),
          0
        );


      // ==============================
      // 화면 숫자 표시
      // ==============================

      document.getElementById("todaySales").textContent =
        won(todayTotal);

      document.getElementById("monthlySales").textContent =
        won(total);

      document.getElementById("totalSales").textContent =
        won(total);

      document.getElementById("salesCount").textContent =
        data.length + "건";


      // ==============================
      // 최근 매출
      // ==============================

      const salesList =
        document.getElementById("salesList");

      salesList.innerHTML = "";

      data.slice(0, 20).forEach(row => {

        const div = document.createElement("div");

        div.className = "row";

        div.innerHTML = `
          <span>
            <strong>${row.channel}</strong>
            <br>
            <small>${row.sale_date}</small>
          </span>

          <strong>${won(row.amount)}</strong>
        `;

        salesList.appendChild(div);

      });


      // ==============================
      // 채널별 매출
      // ==============================

      const channels = {};

      data.forEach(row => {

        if (!channels[row.channel]) {
          channels[row.channel] = 0;
        }

        channels[row.channel] += Number(row.amount);

      });


      const channelList =
        document.getElementById("channelList");

      channelList.innerHTML = "";

      Object.entries(channels)
        .sort((a, b) => b[1] - a[1])
        .forEach(([channel, amount]) => {

          const percentage =
            total > 0
              ? ((amount / total) * 100).toFixed(1)
              : 0;

          const div =
            document.createElement("div");

          div.className = "row";

          div.innerHTML = `
            <span>${channel}</span>
            <strong>
              ${won(amount)}
              (${percentage}%)
            </strong>
          `;

          channelList.appendChild(div);

        });


      loading.style.display = "none";
      dashboard.style.display = "block";

    } catch (error) {

      console.error(error);

      loading.style.display = "none";

      errorBox.style.display = "block";

      errorBox.textContent =
        "매출 데이터를 불러오지 못했습니다: " +
        error.message;

    }

  }


  loadSales();
 async function loadDeposits() {
  const depositList = document.getElementById("depositList");
  const totalDeposit = document.getElementById("totalDeposit");
  const totalFee = document.getElementById("totalFee");

  try {
    const { data, error } = await supabaseClient
      .from("deposit_details")
      .select("*")
      .order("deposit_date", { ascending: false })
      .order("id", { ascending: false });

    if (error) {
      throw error;
    }

    if (!data || data.length === 0) {
      depositList.innerHTML = "<p>등록된 정산 데이터가 없습니다.</p>";
      totalDeposit.textContent = "0원";
      totalFee.textContent = "0원";
      return;
    }

    let depositSum = 0;
    let feeSum = 0;

    depositList.innerHTML = data.map(item => {

      const totalDeductions =
        Number(item.brokerage_fee || 0) +
        Number(item.delivery_fee || 0) +
        Number(item.coupon_discount || 0) +
        Number(item.instant_discount || 0) +
        Number(item.advertising_fee || 0) +
        Number(item.payment_fee || 0) +
        Number(item.vat_1 || 0);

      const adjustments =
        Number(item.fee_adjustment || 0) +
        Number(item.vat_2_adjustment || 0);

      const actualFee = totalDeductions - adjustments;

      depositSum += Number(item.deposit_amount || 0);
      feeSum += actualFee;

      const settlementRate =
        Number(item.sales_amount || 0) > 0
          ? (Number(item.deposit_amount || 0) / Number(item.sales_amount || 0) * 100).toFixed(1)
          : "0.0";

      return `
        <div class="row" style="padding:18px 0;border-bottom:1px solid #eee;">
          <div>
            <strong>${item.channel}</strong>
            <div style="font-size:13px;color:#777;">
              ${item.deposit_date}
            </div>

            <div style="margin-top:10px;font-size:13px;line-height:1.8;color:#555;">
              매출 ${won(item.sales_amount)} ·
              중개 ${won(item.brokerage_fee)} ·
              배달비 ${won(item.delivery_fee)}<br>

              쿠폰 ${won(item.coupon_discount)} ·
              즉시할인 ${won(item.instant_discount)} ·
              광고비 ${won(item.advertising_fee)}<br>

              결제수수료 ${won(item.payment_fee)} ·
              부가세 ${won(item.vat_1)}<br>

              수수료 보정 ${won(item.fee_adjustment)} ·
              부가세 보정 ${won(item.vat_2_adjustment)}
            </div>
          </div>

          <div style="text-align:right;margin-top:10px;">
            <strong>${won(item.deposit_amount)}</strong>

            <div style="font-size:13px;color:#777;">
              매출 ${won(item.sales_amount)}
            </div>

            <div style="font-size:13px;color:#777;">
              실제 정산율 ${settlementRate}%
            </div>

            <div style="font-size:13px;color:#777;">
              실제 차감액 ${won(actualFee)}
            </div>
          </div>
        </div>
      `;
    }).join("");

    totalDeposit.textContent = won(depositSum);
    totalFee.textContent = won(feeSum);

  } catch (error) {
    console.error(error);

    depositList.innerHTML =
      `<p style="color:red;">정산 데이터를 불러오지 못했습니다: ${error.message}</p>`;

  }

  function calculateCoupangFees() {
  const channel = document.getElementById("depositChannel").value;
  const salesAmount = Number(
    document.getElementById("salesAmount").value || 0
  );

  const feeBox = document.getElementById("coupangFeeBox");

  // 쿠팡이츠 수수료 선택창 표시/숨김
  if (feeBox) {
    feeBox.style.display =
      channel === "쿠팡이츠" ? "block" : "none";
  }

  // 매출이 없으면 계산하지 않음
  if (salesAmount <= 0) {
    return;
  }

  // =========================
  // 쿠팡이츠
  // =========================
  if (channel === "쿠팡이츠") {

    const feeRate = Number(
      document.getElementById("coupangFeeRate").value || 0.078
    );

    const brokerageFee = Math.round(
      salesAmount * feeRate
    );

    // 결제대행 수수료 3%
const paymentFee = Math.ceil(
  salesAmount * 0.014
);

    document.getElementById("brokerageFee").value =
      brokerageFee;

    document.getElementById("paymentFee").value =
      paymentFee;

    calculateDeposit();
    return;
  }

  // =========================
  // 배달의민족
  // =========================
  if (channel === "배달의민족") {

    // 중개이용료 6.8%
    const brokerageFee = Math.round(
      salesAmount * 0.068
    );

    // 결제대행 수수료 1.4%
    const paymentFee = Math.ceil(
  salesAmount * 0.014
);

    // 배달비는 정산서에 따라 직접 입력
    const deliveryFee = Number(
      document.getElementById("deliveryFee").value || 0
    );

    // 부가세
    // 중개이용료 + 결제대행 수수료 + 배달비의 10%
    const vat = Math.round(
      (brokerageFee + paymentFee + deliveryFee) * 0.10
    );

    document.getElementById("brokerageFee").value =
      brokerageFee;

    document.getElementById("paymentFee").value =
      paymentFee;

    document.getElementById("vat1").value =
      vat;

    calculateDeposit();
    return;
  }

  // =========================
  // 홀 / 요기요 / 기타
  // =========================
  calculateDeposit();
}
function calculateDeposit() {
  const salesAmount = Number(document.getElementById("salesAmount").value || 0);
  const brokerageFee = Number(document.getElementById("brokerageFee").value || 0);
  const deliveryFee = Number(document.getElementById("deliveryFee").value || 0);
  const couponDiscount = Number(document.getElementById("couponDiscount").value || 0);
  const instantDiscount = Number(document.getElementById("instantDiscount").value || 0);
  const advertisingFee = Number(document.getElementById("advertisingFee").value || 0);
  const paymentFee = Number(document.getElementById("paymentFee").value || 0);
  const vat = Number(document.getElementById("vat1").value || 0);
  const feeAdjustment = Number(document.getElementById("feeAdjustment").value || 0);
  const vatAdjustment = Number(document.getElementById("vat2Adjustment").value || 0);

  const totalDeduction =
    brokerageFee +
    deliveryFee +
    couponDiscount +
    instantDiscount +
    advertisingFee +
    paymentFee +
    vat;

  const depositAmount =
    salesAmount -
    totalDeduction +
    feeAdjustment +
    vatAdjustment;

  document.getElementById("depositAmount").value =
    depositAmount > 0 ? depositAmount : 0;

  const settlementRate =
    salesAmount > 0
      ? ((depositAmount / salesAmount) * 100).toFixed(1)
      : "0.0";

  document.getElementById("depositCalcInfo").textContent =
    `예상 정산액 ${won(depositAmount)} · 실제 정산률 ${settlementRate}% · 총 차감액 ${won(salesAmount - depositAmount)}`;
}

  async function saveDeposit() {
  const depositDate = document.getElementById("depositDate").value;

  const salesAmount = Number(document.getElementById("salesAmount").value || 0);
  const brokerageFee = Number(document.getElementById("brokerageFee").value || 0);

  const instantDiscount = Number(document.getElementById("instantDiscount").value || 0);
  const advertisingFee = Number(document.getElementById("advertisingFee").value || 0);
  const paymentFee = Number(document.getElementById("paymentFee").value || 0);
  const vat = Number(document.getElementById("vat1").value || 0);
  const feeAdjustment = Number(document.getElementById("feeAdjustment").value || 0);
  const vatAdjustment = Number(document.getElementById("vat2Adjustment").value || 0);
  const depositAmount = Number(document.getElementById("depositAmount").value || 0);
  const memo = document.getElementById("depositMemo").value;

  if (!depositDate) {
    alert("정산 날짜를 입력해주세요.");
    return;
  }

  if (!salesAmount) {
    alert("매출액을 입력해주세요.");
    return;
  }

  if (!depositAmount) {
    alert("최종 정산액을 입력해주세요.");
    return;
  }

  try {
    const { error } = await supabaseClient
      .from("deposit_details")
      .insert({
        deposit_date: depositDate,
        channel: channel,
        sales_amount: salesAmount,
        brokerage_fee: brokerageFee,
        delivery_fee: deliveryFee,
        coupon_discount: couponDiscount,
        instant_discount: instantDiscount,
        advertising_fee: advertisingFee,
        payment_fee: paymentFee,
        vat: vat,
        fee_adjustment: feeAdjustment,
        vat_adjustment: vatAdjustment,
        deposit_amount: depositAmount,
        memo: memo
      });

    if (error) {
      throw error;
    }

    alert("정산이 저장되었습니다.");

    document.getElementById("salesAmount").value = "";
    document.getElementById("brokerageFee").value = "";
    document.getElementById("deliveryFee").value = "";
    document.getElementById("couponDiscount").value = "";
    document.getElementById("instantDiscount").value = "";
    document.getElementById("advertisingFee").value = "";
    document.getElementById("paymentFee").value = "";
    document.getElementById("vat1").value = "";
    document.getElementById("feeAdjustment").value = "";
    document.getElementById("vat2Adjustment").value = "";
    document.getElementById("depositAmount").value = "";
    document.getElementById("depositMemo").value = "";

    await loadDeposits();

  } catch (error) {
    console.error(error);
    alert("정산 저장에 실패했습니다: " + error.message);
  }
