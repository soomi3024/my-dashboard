<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>더 타코부스 경영관리</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 24px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .amount {
      font-size: 28px;
      font-weight: bold;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .channel {
      font-weight: 600;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
    }

    .notice {
      background: #eef4ff;
      border-radius: 12px;
      padding: 18px;
      color: #2455c3;
    }

    @media (max-width: 700px) {
      .container {
        padding: 16px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .amount {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>더 타코부스 경영관리</h1>
    <div class="subtitle">매장 운영 현황 · 2026년 8월</div>

    <div class="cards">

      <div class="card">
        <div class="card-title">8월 24일 총매출</div>
        <div class="amount">1,045,000원</div>
      </div>

      <div class="card">
        <div class="card-title">8월 누적 매출</div>
        <div class="amount">1,045,000원</div>
      </div>

      <div class="card">
        <div class="card-title">오늘 확인할 데이터</div>
        <div class="amount">3건</div>
      </div>

    </div>

    <div class="section">

      <h2>8월 24일 매출</h2>

      <div class="row">
        <span class="channel">홀</span>
        <strong>605,400원</strong>
      </div>

      <div class="row">
        <span class="channel">배달의민족</span>
        <strong>21,000원</strong>
      </div>

      <div class="row">
        <span class="channel">쿠팡이츠</span>
        <strong>418,600원</strong>
      </div>

      <div class="row total">
        <span>총매출</span>
        <span>1,045,000원</span>
      </div>

    </div>

    <div class="section">

      <h2>매출 구성</h2>

      <div class="row">
        <span>홀</span>
        <strong>57.9%</strong>
      </div>

      <div class="row">
        <span>배달의민족</span>
        <strong>2.0%</strong>
      </div>

      <div class="row">
        <span>쿠팡이츠</span>
        <strong>40.1%</strong>
      </div>

    </div>

    <div class="section">

      <h2>경영 현황</h2>

      <div class="notice">
        현재는 매출 데이터가 연결된 상태입니다.<br><br>
        다음 단계에서는 지출 데이터를 연결해서
        <strong>매출 - 지출 = 실제 이익</strong>을 자동으로 계산하도록 만들 예정입니다.
      </div>

    </div>

  </div>

</body>
</html>
