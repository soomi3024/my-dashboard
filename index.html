    * {

    .total {

    }

        padding: 16px;

        font-size: 25px;

}

/* 여기부터 새로 추가 */
.deposit-form {

@media (max-width: 600px) {

<script>

  // ==========================================
  // Supabase
  // ==========================================

  const SUPABASE_URL =
    "https://gvlfyzdswegwmmpzoabc.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Inp1yZHn3Qrqtzq1TWgUaw_AWxEgK5y";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ==========================================
  // 기본 변수
  // ==========================================

  let selectedProfitSales = 0;
  let editingDepositId = null;


  // ==========================================
  // 원화 표시
  // ==========================================

  function won(number) {
    return Number(number || 0).toLocaleString("ko-KR") + "원";
  }


  // ==========================================
  // 차트 영역 생성
  // ==========================================

  function createChartAreas() {

    // --------------------------
    // 매출 채널 원형 그래프
    // --------------------------

    const channelList =
      document.getElementById("channelList");

    if (channelList && !document.getElementById("channelPieChart")) {

      channelList.innerHTML = `
        <div
          id="channelPieChart"
          style="
            width:220px;
            height:220px;
            border-radius:50%;
            margin:20px auto;
            background:#eee;
          "
        ></div>

        <div
          id="channelLegend"
          style="
            display:grid;
            gap:8px;
            margin-top:15px;
          "
        ></div>
      `;
    }


    // --------------------------
    // 손익 원형 그래프
    // --------------------------

    const profitSummary =
      document.querySelector(".profit-summary");

    if (
      profitSummary &&
      !document.getElementById("profitPieChart")
    ) {

      const chartBox =
        document.createElement("div");

      chartBox.innerHTML = `
        <div
          id="profitPieChart"
          style="
            width:220px;
            height:220px;
            border-radius:50%;
            margin:20px auto;
            background:#eee;
          "
        ></div>

        <div
          id="profitLegend"
          style="
            display:grid;
            gap:8px;
            margin:15px 0 25px;
          "
        ></div>
      `;

      profitSummary.prepend(chartBox);
    }
  }


  // ==========================================
  // 매출 채널 원형 그래프
  // ==========================================

  function drawChannelChart(channels, total) {

    createChartAreas();

    const chart =
      document.getElementById("channelPieChart");

    const legend =
      document.getElementById("channelLegend");

    if (!chart || !legend) {
      return;
    }

    const entries =
      Object.entries(channels)
        .sort((a, b) => b[1] - a[1]);

    if (!entries.length || total <= 0) {

      chart.style.background = "#eee";

      legend.innerHTML =
        "<div>선택한 조건의 매출이 없습니다.</div>";

      return;
    }


    const colors = [
      "#4CAF50",
      "#2196F3",
      "#FF9800",
      "#9C27B0",
      "#F44336",
      "#00BCD4",
      "#795548",
      "#607D8B"
    ];


    let current = 0;

    const gradients = [];

    entries.forEach(([channel, amount], index) => {

      const percentage =
        (amount / total) * 100;

      const start = current;
      const end = current + percentage;

      gradients.push(
        `${colors[index % colors.length]} ${start}% ${end}%`
      );

      current = end;

    });


    chart.style.background =
      `conic-gradient(${gradients.join(",")})`;


    legend.innerHTML =
      entries.map(([channel, amount], index) => {

        const percentage =
          ((amount / total) * 100).toFixed(1);

        return `
          <div
            style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              font-size:14px;
            "
          >
            <span>
              <span
                style="
                  display:inline-block;
                  width:10px;
                  height:10px;
                  border-radius:50%;
                  background:${colors[index % colors.length]};
                  margin-right:6px;
                "
              ></span>

              ${channel}
            </span>

            <strong>
              ${won(amount)}
              (${percentage}%)
            </strong>
          </div>
        `;

      }).join("");
  }


  // ==========================================
  // 손익 원형 그래프
  // ==========================================

  function drawProfitChart(
    variableCost,
    fixedCost,
    financialCost,
    otherCost,
    netProfit
  ) {

    createChartAreas();

    const chart =
      document.getElementById("profitPieChart");

    const legend =
      document.getElementById("profitLegend");

    if (!chart || !legend) {
      return;
    }


    const items = [
      ["변동비", variableCost, "#FF9800"],
      ["고정비", fixedCost, "#2196F3"],
      ["금융비용", financialCost, "#9C27B0"],
      ["기타비용", otherCost, "#F44336"]
    ];


    if (netProfit > 0) {
      items.push(
        ["순이익", netProfit, "#4CAF50"]
      );
    }


    const validItems =
      items.filter(item => item[1] > 0);

    const total =
      validItems.reduce(
        (sum, item) => sum + item[1],
        0
      );


    if (total <= 0) {

      chart.style.background = "#eee";

      legend.innerHTML =
        "<div>입력된 손익 데이터가 없습니다.</div>";

      return;
    }


    let current = 0;
    const gradients = [];


    validItems.forEach(item => {

      const percentage =
        (item[1] / total) * 100;

      const start = current;
      const end = current + percentage;

      gradients.push(
        `${item[2]} ${start}% ${end}%`
      );

      current = end;

    });


    chart.style.background =
      `conic-gradient(${gradients.join(",")})`;


    legend.innerHTML =
      validItems.map(item => {

        const percentage =
          ((item[1] / total) * 100).toFixed(1);

        return `
          <div
            style="
              display:flex;
              justify-content:space-between;
              font-size:14px;
            "
          >
            <span>
              <span
                style="
                  display:inline-block;
                  width:10px;
                  height:10px;
                  border-radius:50%;
                  background:${item[2]};
                  margin-right:6px;
                "
              ></span>

              ${item[0]}
            </span>

            <strong>
              ${won(item[1])}
              (${percentage}%)
            </strong>
          </div>
        `;

      }).join("");


    if (netProfit < 0) {

      legend.innerHTML += `
        <div
          style="
            margin-top:8px;
            padding:10px;
            border-radius:8px;
            background:#fff0f0;
            color:#c62828;
            font-weight:bold;
          "
        >
          현재 순손실 ${won(Math.abs(netProfit))}
        </div>
      `;

    }
  }


  // ==========================================
  // 월별 손익관리
  // ==========================================

  async function loadProfitSales() {

    const monthInput =
      document.getElementById("profitMonth");

    if (!monthInput) {
      return;
    }

    const month =
      monthInput.value;


    if (!month) {

      selectedProfitSales = 0;

      document.getElementById(
        "profitSales"
      ).textContent = "0원";

      calculateMonthlyProfit();

      return;
    }


    const startDate =
      month + "-01";

    const nextMonth =
      new Date(startDate);

    nextMonth.setMonth(
      nextMonth.getMonth() + 1
    );


    const endDate =
      nextMonth.getFullYear() +
      "-" +
      String(
        nextMonth.getMonth() + 1
      ).padStart(2, "0") +
      "-01";


    const {
      data,
      error
    } = await supabaseClient
      .from("sales")
      .select("amount")
      .gte("sale_date", startDate)
      .lt("sale_date", endDate);


    if (error) {

      console.error(error);

      alert(
        "매출 데이터를 불러오지 못했습니다: " +
        error.message
      );

      return;
    }


    selectedProfitSales =
      (data || []).reduce(
        (sum, row) =>
          sum + Number(row.amount || 0),
        0
      );


    document.getElementById(
      "profitSales"
    ).textContent =
      won(selectedProfitSales);


    calculateMonthlyProfit();
  }


  // ==========================================
  // 손익 계산
  // ==========================================

  function calculateMonthlyProfit() {

    const sales =
      selectedProfitSales || 0;


    const logistics =
      Number(
        document.getElementById(
          "profitLogistics"
        ).value || 0
      );

    const deliveryFee =
      Number(
        document.getElementById(
          "profitDeliveryFee"
        ).value || 0
      );

    const cardFee =
      Number(
        document.getElementById(
          "profitCardFee"
        ).value || 0
      );

    const advertising =
      Number(
        document.getElementById(
          "profitAdvertising"
        ).value || 0
      );


    // 로열티 = 월매출 2% + 부가세 10%
    const royalty =
      Math.round(
        sales * 0.02 * 1.1
      );


    document.getElementById(
      "profitRoyaltyBase"
    ).value =
      royalty;


    const gas =
      Number(
        document.getElementById(
          "profitGas"
        ).value || 0
      );

    const utility =
      Number(
        document.getElementById(
          "profitUtility"
        ).value || 0
      );

    const insurance =
      Number(
        document.getElementById(
          "profitInsurance"
        ).value || 0
      );


    const labor =
      Number(
        document.getElementById(
          "profitLabor"
        ).value || 0
      );

    const rent =
      Number(
        document.getElementById(
          "profitRent"
        ).value || 0
      );

    const torder =
      Number(
        document.getElementById(
          "profitTorder"
        ).value || 0
      );

    const pos =
      Number(
        document.getElementById(
          "profitPos"
        ).value || 0
      );

    const accountant =
      Number(
        document.getElementById(
          "profitTaxAccountant"
        ).value || 0
      );

    const otherFixed =
      Number(
        document.getElementById(
          "profitOtherFixed"
        ).value || 0
      );


    const loanInterest =
      Number(
        document.getElementById(
          "profitLoanInterest"
        ).value || 0
      );

    const other =
      Number(
        document.getElementById(
          "profitOther"
        ).value || 0
      );


    const totalVariable =
      logistics +
      deliveryFee +
      cardFee +
      advertising +
      royalty +
      gas +
      utility +
      insurance;


    const totalFixed =
      labor +
      rent +
      torder +
      pos +
      accountant +
      otherFixed;


    const totalFinancial =
      loanInterest;


    const netProfit =
      sales -
      totalVariable -
      totalFixed -
      totalFinancial -
      other;


    const profitRate =
      sales > 0
        ? (
            (netProfit / sales) *
            100
          ).toFixed(1)
        : "0.0";


    document.getElementById(
      "profitSales"
    ).textContent =
      won(sales);


    document.getElementById(
      "profitVariableCost"
    ).textContent =
      won(totalVariable);


    document.getElementById(
      "profitFixedCost"
    ).textContent =
      won(totalFixed);


    document.getElementById(
      "profitFinancialCost"
    ).textContent =
      won(totalFinancial);


    document.getElementById(
      "profitOtherCost"
    ).textContent =
      won(other);


    document.getElementById(
      "profitNet"
    ).textContent =
      won(netProfit);


    document.getElementById(
      "profitRate"
    ).textContent =
      profitRate + "%";


    drawProfitChart(
      totalVariable,
      totalFixed,
      totalFinancial,
      other,
      netProfit
    );
  }

  function applyMonthlyProfitFormData(data) {
    if (!data) return;

      const element = document.getElementById(id);
      if (element) element.value = value ?? "";
    });

    calculateMonthlyProfit();
  }

  function loadSavedMonthlyProfit() {
    const month = document.getElementById("profitMonth")?.value;
    if (!month) return;

    try {
      const saved = localStorage.getItem("tacobooth_monthly_profit_" + month);
      if (saved) {
        applyMonthlyProfitFormData(JSON.parse(saved));
      }
    } catch (error) {
      console.error("월별 손익 불러오기 실패", error);
    }
  }

      alert("저장할 월을 먼저 선택해주세요.");
      return;
    }

    try {
      const data = getMonthlyProfitFormData();
      localStorage.setItem(
        "tacobooth_monthly_profit_" + month,
        JSON.stringify(data)
      );

      calculateMonthlyProfit();
      alert(month + " 손익 데이터가 저장되었습니다.");
    } catch (error) {
      console.error(error);
      alert("손익 저장에 실패했습니다: " + error.message);

  async function loadSales() {

    const loading =
      document.getElementById("loading");

    const errorBox =
      document.getElementById("error");

    const dashboard =
      document.getElementById("dashboard");


    try {

      const {
        data,
        error
      } = await supabaseClient
        .from("sales")
        .select("*")
        .order(
          "sale_date",
          { ascending:false }
        )
        .order(
          "id",
          { ascending:false }
        );


      if (error) {
        throw error;
      }


      const saleMonthFilter =
        document.getElementById(
          "saleMonthFilter"
        )?.value || "";


      const saleDateFilter =
        document.getElementById(
          "saleDateFilter"
        )?.value || "";


      let filteredSales =
        data || [];


      if (saleMonthFilter) {

        filteredSales =
          filteredSales.filter(
            row =>
              row.sale_date &&
              row.sale_date.startsWith(
                saleMonthFilter
              )
          );

      }


      if (saleDateFilter) {

        filteredSales =
          filteredSales.filter(
            row =>
              row.sale_date ===
              saleDateFilter
          );

      }


      const total =
        filteredSales.reduce(
          (sum, row) =>
            sum + Number(row.amount || 0),
          0
        );


      const today =
        new Date()
          .toISOString()
          .split("T")[0];


      const todayTotal =
        (data || [])
          .filter(
            row =>
              row.sale_date === today
          )
          .reduce(
            (sum, row) =>
              sum + Number(row.amount || 0),
            0
          );


      document.getElementById(
        "todaySales"
      ).textContent =
        won(todayTotal);


      document.getElementById(
        "monthlySales"
      ).textContent =
        won(total);


      document.getElementById(
        "totalSales"
      ).textContent =
        won(total);


      document.getElementById(
        "salesCount"
      ).textContent =
        filteredSales.length + "건";


      const salesList =
        document.getElementById(
          "salesList"
        );


      salesList.innerHTML = "";


      if (!filteredSales.length) {

        salesList.innerHTML =
          "<p>선택한 조건의 매출이 없습니다.</p>";

      } else {

        filteredSales
          .slice(0, 50)
          .forEach(row => {

            const div =
              document.createElement("div");

            div.className = "row";


            div.innerHTML = `
              <span>
                <strong>
                  ${row.channel}
                </strong>

                <br>

                <small>
                  ${row.sale_date}
                </small>
              </span>

              <span>

                <strong>
                  ${won(row.amount)}
                </strong>

                <br>

                <button
                  type="button"
                  onclick="editSale(${row.id})"
                  style="
                    margin-top:5px;
                    margin-right:5px;
                  "
                >
                  수정
                </button>

                <button
                  type="button"
                  onclick="deleteSale(${row.id})"
                >
                  삭제
                </button>

              </span>
            `;


            salesList.appendChild(div);

          });

      }


      // --------------------------
      // 채널별 집계
      // --------------------------

      const channels = {};


      filteredSales.forEach(row => {

        if (!channels[row.channel]) {
          channels[row.channel] = 0;
        }

        channels[row.channel] +=
          Number(row.amount || 0);

      });


      drawChannelChart(
        channels,
        total
      );


      loading.style.display =
        "none";

      dashboard.style.display =
        "block";


    } catch (error) {

      console.error(error);

      loading.style.display =
        "none";

      errorBox.style.display =
        "block";

      errorBox.textContent =
        "매출 데이터를 불러오지 못했습니다: " +
        error.message;

    }

  }

  // ==========================================
  // 매출 수정
  // ==========================================

  async function editSale(id) {

    try {

      const {
        data: sale,
        error: fetchError
      } =
        await supabaseClient
          .from("sales")
          .select("*")
          .eq("id", id)
          .single();


      if (fetchError) {
        throw fetchError;
      }


      const newDate =
        prompt(
          "매출 날짜를 수정하세요.",
          sale.sale_date
        );


      if (!newDate) {
        return;
      }


      const allowedChannels = [
        "홀",
        "쿠팡이츠",
        "배달의민족",
        "요기요",
        "식권",
        "식신",
        "네이버 포장",
        "기타"
      ];


      const newChannel =
        prompt(
          "매출 채널을 수정하세요.\n\n" +
          "홀 / 쿠팡이츠 / 배달의민족 / 요기요 / 식권 / 식신 / 네이버 포장 / 기타",
          sale.channel
        );


      if (!newChannel) {
        return;
      }


      if (
        !allowedChannels.includes(
          newChannel
        )
      ) {

        alert(
          "올바른 채널을 입력해주세요."
        );

        return;
      }


      const newAmount =
        prompt(
          "매출액을 수정하세요.",
          sale.amount
        );


      if (
        !newAmount ||
        Number(newAmount) <= 0
      ) {

        alert(
          "올바른 매출액을 입력해주세요."
        );

        return;
      }


      const {
        data: updatedSale,
        error: updateError
      } =
        await supabaseClient
          .from("sales")
          .update({
            sale_date: newDate,
            channel: newChannel,
            amount: Number(newAmount)
          })
          .eq("id", id)
          .select()
          .single();


      if (updateError) {
        throw updateError;
      }


      if (!updatedSale) {

        alert(
          "수정된 매출을 확인하지 못했습니다."
        );

        return;
      }


      alert(
        "매출이 수정되었습니다.\n\n" +
        "날짜: " + updatedSale.sale_date + "\n" +
        "채널: " + updatedSale.channel + "\n" +
        "매출: " + won(updatedSale.amount)
      );


      await loadSales();
      await loadProfitSales();


    } catch (error) {

      console.error(error);

      alert(
        "매출 수정에 실패했습니다: " +
        error.message
      );

    }

  }

  // ==========================================

  // ==========================================

  function calculateCoupangFees() {

    const channel =
      document.getElementById(
        "depositChannel"
      ).value;


    const salesAmount =
      Number(
        document.getElementById(
          "salesAmount"
        ).value || 0
      );


    const feeBox =
      document.getElementById(
        "coupangFeeBox"
      );


    if (feeBox) {

      feeBox.style.display =
        channel === "쿠팡이츠"
          ? "block"
          : "none";

    }


    if (salesAmount <= 0) {
      return;
    }


    // 쿠팡이츠
    if (
      channel ===
      "쿠팡이츠"
    ) {

      const feeRate =
        Number(
          document.getElementById(
            "coupangFeeRate"
          ).value || 0.078
        );


      const brokerageFee =
        Math.round(
          salesAmount * feeRate
        );


      // 결제대행 수수료 3%
      const paymentFee =
        Math.ceil(
          salesAmount * 0.03
        );


      document.getElementById(
        "brokerageFee"
      ).value =
        brokerageFee;


      document.getElementById(
        "paymentFee"
      ).value =
        paymentFee;


      calculateDeposit();

      return;
    }


    // 배달의민족
    if (
      channel ===
      "배달의민족"
    ) {

      const brokerageFee =
        Math.round(
          salesAmount * 0.068
        );


      // 결제대행 수수료 1.4%
      const paymentFee =
        Math.ceil(
          salesAmount * 0.014
        );


      const deliveryFee =
        Number(
          document.getElementById(
            "deliveryFee"
          ).value || 0
        );


      const vat =
        Math.round(
          (
            brokerageFee +
            paymentFee +
            deliveryFee
          ) * 0.10
        );


      document.getElementById(
        "brokerageFee"
      ).value =
        brokerageFee;


      document.getElementById(
        "paymentFee"
      ).value =
        paymentFee;


      document.getElementById(
        "vat1"
      ).value =
        vat;


      calculateDeposit();

      return;
    }


    calculateDeposit();

  }


  // ==========================================
  // 정산 자동 계산
  // ==========================================

  function calculateDeposit() {

    const ids = [
      "salesAmount",
      "brokerageFee",
      "deliveryFee",
      "couponDiscount",
      "instantDiscount",
      "advertisingFee",
      "paymentFee",
      "vat1",
      "feeAdjustment",
      "vat2Adjustment"
    ];


    const values = {};


    ids.forEach(id => {

      values[id] =
        Number(
          document.getElementById(id)
            ?.value || 0
        );

    });


    const totalDeduction =
      values.brokerageFee +
      values.deliveryFee +
      values.couponDiscount +
      values.instantDiscount +
      values.advertisingFee +
      values.paymentFee +
      values.vat1;


    const depositAmount =
      values.salesAmount -
      totalDeduction +
      values.feeAdjustment +
      values.vat2Adjustment;


    const finalAmount =
      Math.max(
        depositAmount,
        0
      );


    const depositAmountInput =
      document.getElementById(
        "depositAmount"
      );


    if (depositAmountInput) {

      depositAmountInput.value =
        finalAmount;

    }


    const info =
      document.getElementById(
        "depositCalcInfo"
      );


    if (info) {

      const rate =
        values.salesAmount > 0
          ? (
              finalAmount /
              values.salesAmount *
              100
            ).toFixed(1)
          : "0.0";


      info.textContent =
        `예상 정산액 ${won(finalAmount)} · ` +
        `실제 정산률 ${rate}% · ` +
        `총 차감액 ${won(
          values.salesAmount -
          finalAmount
        )}`;

    }

  }

                      font-size:13px;
                      color:#777;
                    "
                  >
                    ${item.deposit_date}
                  </div>


                  <div
                    style="
                      margin-top:10px;
                      font-size:13px;
                      line-height:1.8;
                      color:#555;
                    "
                  >

                    매출 ${won(item.sales_amount)} ·
                    중개 ${won(item.brokerage_fee)} ·
                    배달비 ${won(item.delivery_fee)}
                    <br>

                    쿠폰 ${won(item.coupon_discount)} ·
                    즉시할인 ${won(item.instant_discount)} ·
                    광고비 ${won(item.advertising_fee)}
                    <br>

                    결제수수료 ${won(item.payment_fee)} ·
                    부가세 ${won(item.vat)}
                    <br>

                    수수료 보정 ${won(item.fee_adjustment)} ·
                    부가세 보정 ${won(item.vat_adjustment)}

                  </div>

                </div>


                <div
                  style="
                    text-align:right;
                    margin-top:10px;
                  "
                >

                  <strong>
                    ${won(item.deposit_amount)}
                  </strong>

                  <div
                    style="
                      font-size:13px;
                      color:#777;
                    "
                  >
                    매출 ${won(item.sales_amount)}
                  </div>

                  <div
                    style="
                      font-size:13px;
                      color:#777;
                    "
                  >
                    실제 정산율 ${settlementRate}%
                  </div>

                  <div
                    style="
                      font-size:13px;
                      color:#777;
                    "
                  >
                    실제 차감액 ${won(actualFee)}
                  </div>

                </div>

              </div>
            `;

          })
          .join("");


      totalDeposit.textContent =
        won(depositSum);


      totalFee.textContent =
        won(feeSum);


    } catch (error) {

      console.error(error);

      depositList.innerHTML =
        `<p style="color:red;">
          정산 데이터를 불러오지 못했습니다:
          ${error.message}
        </p>`;


      totalDeposit.textContent =
        "0원";


      totalFee.textContent =
        "0원";

    }

  }


  // ==========================================
  // 정산 저장
  // ==========================================

  async function saveDeposit() {

    const depositDate =
      document.getElementById("depositDate").value;

    const channel =
      document.getElementById("depositChannel").value;

    const salesAmount =
      Number(document.getElementById("salesAmount").value || 0);

    const brokerageFee =
      Number(document.getElementById("brokerageFee").value || 0);

    const deliveryFee =
      Number(document.getElementById("deliveryFee").value || 0);

    const couponDiscount =
      Number(document.getElementById("couponDiscount").value || 0);

    const instantDiscount =
      Number(document.getElementById("instantDiscount").value || 0);

    const advertisingFee =
      Number(document.getElementById("advertisingFee").value || 0);

    const paymentFee =
      Number(document.getElementById("paymentFee").value || 0);

    const vat =
      Number(document.getElementById("vat1").value || 0);

    const feeAdjustment =
      Number(document.getElementById("feeAdjustment").value || 0);

    const vatAdjustment =
      Number(document.getElementById("vat2Adjustment").value || 0);

    const depositAmount =
      Number(document.getElementById("depositAmount").value || 0);

    const memo =
      document.getElementById("depositMemo").value;

    if (!depositDate) {
      alert("정산 날짜를 입력해주세요.");
      return;
    }

    if (salesAmount <= 0) {
      alert("매출액을 입력해주세요.");
      return;
    }

    if (depositAmount < 0) {
      alert("최종 정산액을 확인해주세요.");
      return;
    }

    try {

      const payload = {
        deposit_date: depositDate,
        channel: channel,
        sales_amount: salesAmount,
        brokerage_fee: brokerageFee,
        delivery_fee: deliveryFee,
        coupon_discount: couponDiscount,
        instant_discount: instantDiscount,
        advertising_fee: advertisingFee,
        payment_fee: paymentFee,
        vat: vat,
        fee_adjustment: feeAdjustment,
        vat_adjustment: vatAdjustment,
        deposit_amount: depositAmount,
        memo: memo
      };

      let error;

      if (editingDepositId !== null) {

        const result = await supabaseClient
          .from("deposit_details")
          .update(payload)
          .eq("id", Number(editingDepositId))
          .select("id");

        error = result.error;

        if (error) {
          throw error;
        }

        if (!result.data || result.data.length === 0) {
          throw new Error(
            "수정된 정산 내역이 없습니다. Supabase의 deposit_details UPDATE 권한(RLS 정책)을 확인해주세요."
          );
        }

        alert("정산 내역이 수정되었습니다.");

      } else {

        const result = await supabaseClient
          .from("deposit_details")
          .insert(payload);

        error = result.error;

        if (error) {
          throw error;
        }

        alert("정산이 저장되었습니다.");
      }

      editingDepositId = null;

      const saveButton =
        document.getElementById("depositSaveButton");

      const cancelButton =
        document.getElementById("depositCancelButton");

      if (saveButton) {
        saveButton.textContent = "정산 저장";
      }

      if (cancelButton) {
        cancelButton.style.display = "none";
      }

      [
        "salesAmount",
        "brokerageFee",
        "deliveryFee",
        "couponDiscount",
        "instantDiscount",
        "advertisingFee",
        "paymentFee",
        "vat1",
        "feeAdjustment",
        "vat2Adjustment",
        "depositAmount",
        "depositMemo"
      ].forEach(id => {
        const element = document.getElementById(id);
        if (element) element.value = "";
      });

      document.getElementById("depositDate").value = "";
      document.getElementById("depositChannel").value = "쿠팡이츠";

      const feeBox = document.getElementById("coupangFeeBox");
      if (feeBox) feeBox.style.display = "none";

      await loadDeposits();

    } catch (error) {

      console.error(error);

      alert(
        (editingDepositId !== null
          ? "정산 수정에 실패했습니다: "
          : "정산 저장에 실패했습니다: ") +
        error.message
      );

    }

  }

  // ==========================================
  // 정산 수정
  // ==========================================

  async function editDeposit(id) {

    try {

      const { data: item, error } =
        await supabaseClient
          .from("deposit_details")
          .select("*")
          .eq("id", id)
          .single();

      if (error) {
        throw error;
      }

      // 기존 정산 데이터를 '정산 등록' 입력창에 그대로 불러옵니다.
      editingDepositId = id;

      document.getElementById("depositDate").value =
        item.deposit_date || "";

      document.getElementById("depositChannel").value =
        item.channel || "쿠팡이츠";

      document.getElementById("salesAmount").value =
        item.sales_amount ?? "";

      document.getElementById("brokerageFee").value =
        item.brokerage_fee ?? "";

      document.getElementById("deliveryFee").value =
        item.delivery_fee ?? "";

      document.getElementById("couponDiscount").value =
        item.coupon_discount ?? "";

      document.getElementById("instantDiscount").value =
        item.instant_discount ?? "";

      document.getElementById("advertisingFee").value =
        item.advertising_fee ?? "";

      document.getElementById("paymentFee").value =
        item.payment_fee ?? "";

      document.getElementById("vat1").value =
        item.vat ?? "";

      document.getElementById("feeAdjustment").value =
        item.fee_adjustment ?? "";

      document.getElementById("vat2Adjustment").value =
        item.vat_adjustment ?? "";

      document.getElementById("depositAmount").value =
        item.deposit_amount ?? "";

      document.getElementById("depositMemo").value =
        item.memo || "";

      // 쿠팡이츠 수수료 선택창 표시
      const feeBox =
        document.getElementById("coupangFeeBox");

      if (feeBox) {
        feeBox.style.display =
          item.channel === "쿠팡이츠"
            ? "block"
            : "none";
      }

      // 수정 모드로 전환
      const saveButton =
        document.getElementById("depositSaveButton");

      const cancelButton =
        document.getElementById("depositCancelButton");

      if (saveButton) {
        saveButton.textContent = "정산 수정 저장";
      }

      if (cancelButton) {
        cancelButton.style.display = "inline-block";
      }

      const form =
        document.querySelector(".deposit-form");

      if (form) {
        form.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }

      // 현재 저장되어 있던 값을 기준으로 다시 계산하지 않습니다.
      // 사용자가 매출/수수료 등을 변경하면 자동 계산됩니다.
      const info =
        document.getElementById("depositCalcInfo");

      if (info) {
        const rate =
          Number(item.sales_amount || 0) > 0
            ? (
                Number(item.deposit_amount || 0) /
                Number(item.sales_amount || 0) *
                100
              ).toFixed(1)
            : "0.0";

        info.textContent =
          `현재 정산액 ${won(item.deposit_amount)} · 정산률 ${rate}% · 수정 후 '정산 수정 저장'을 눌러주세요.`;
      }

    } catch (error) {

      console.error(error);

      alert(
        "정산 수정 화면을 불러오지 못했습니다: " +
        error.message
      );

    }

  }


  function cancelDepositEdit() {

    editingDepositId = null;

    const saveButton =
      document.getElementById("depositSaveButton");

    const cancelButton =
      document.getElementById("depositCancelButton");

    if (saveButton) {
      saveButton.textContent = "정산 저장";
    }

    if (cancelButton) {
      cancelButton.style.display = "none";
    }

    [
      "salesAmount",
      "brokerageFee",
      "deliveryFee",
      "couponDiscount",
      "instantDiscount",
      "advertisingFee",
      "paymentFee",
      "vat1",
      "feeAdjustment",
      "vat2Adjustment",
      "depositAmount",
      "depositMemo"
    ].forEach(id => {
      const element = document.getElementById(id);
      if (element) element.value = "";
    });

    document.getElementById("depositDate").value = "";
    document.getElementById("depositChannel").value = "쿠팡이츠";

    const info =
      document.getElementById("depositCalcInfo");

    if (info) {
      info.textContent =
        "입력한 금액을 기준으로 자동 계산됩니다.";
    }

  }

  // ==========================================
  // 정산 삭제
  // ==========================================

  async function deleteDeposit(id) {

    if (!confirm("이 정산 내역을 삭제하시겠습니까?")) {
      return;
    }

    try {

      const { data: deletedRows, error } =
        await supabaseClient
          .from("deposit_details")
          .delete()
          .eq("id", Number(id))
          .select("id");

      if (error) {
        throw error;
      }

      if (!deletedRows || deletedRows.length === 0) {
        throw new Error(
          "삭제된 정산 내역이 없습니다. Supabase의 deposit_details DELETE 권한(RLS 정책)을 확인해주세요."
        );
      }

      alert("정산 내역이 삭제되었습니다.");

      await loadDeposits();

    } catch (error) {

      console.error(error);

      alert(
        "정산 삭제에 실패했습니다: " +
        error.message
      );

    }

  }


  // ==========================================
  // 이벤트 연결
  // ==========================================

  const saleMonthFilter =
    document.getElementById(
      "saleMonthFilter"
    );

  const saleDateFilter =
    document.getElementById(
      "saleDateFilter"
    );


  if (saleMonthFilter) {

    saleMonthFilter.addEventListener(
      "change",
      loadSales
    );

  }


  if (saleDateFilter) {

    saleDateFilter.addEventListener(
      "change",
      loadSales
    );

  }


  const depositMonthFilter =
    document.getElementById(
      "depositMonthFilter"
    );

  const depositDateFilter =
    document.getElementById(
      "depositDateFilter"
    );


  if (depositMonthFilter) {

    depositMonthFilter.addEventListener(
      "change",
      loadDeposits
    );

  }


  if (depositDateFilter) {

    depositDateFilter.addEventListener(
      "change",
      loadDeposits
    );

  }


  function clearSaleFilter() {

    if (saleMonthFilter) {
      saleMonthFilter.value = "";
    }

    if (saleDateFilter) {
      saleDateFilter.value = "";
    }

    loadSales();

  }


  function clearDepositFilter() {

    if (depositMonthFilter) {
      depositMonthFilter.value = "";
    }

    if (depositDateFilter) {
      depositDateFilter.value = "";
    }

    loadDeposits();

  }


  // ==========================================
  // 정산 입력 자동계산 이벤트
  // ==========================================

  [
    "salesAmount",
    "brokerageFee",
    "deliveryFee",
    "couponDiscount",
    "instantDiscount",
    "advertisingFee",
    "paymentFee",
    "vat1",
    "feeAdjustment",
    "vat2Adjustment"
  ].forEach(id => {

    const element =
      document.getElementById(id);

    if (element) {

      element.addEventListener(
        "input",
        calculateDeposit
      );

      element.addEventListener(
        "change",
        calculateDeposit
      );

    }

  });


  const salesInput =
    document.getElementById(
      "salesAmount"
    );

  const channelSelect =
    document.getElementById(
      "depositChannel"
    );


  if (salesInput) {

    salesInput.addEventListener(
      "input",
      calculateCoupangFees
    );

    salesInput.addEventListener(
      "change",
      calculateCoupangFees
    );

  }


  if (channelSelect) {

    channelSelect.addEventListener(
      "change",
      calculateCoupangFees
    );

  }


  const profitMonthInput =
    document.getElementById(
      "profitMonth"
    );


  if (profitMonthInput) {

    profitMonthInput.addEventListener(
      "change",
      async () => {
        await loadProfitSales();
        loadSavedMonthlyProfit();
      }
    );

  }


  // ==========================================
  // 최초 실행
  // ==========================================

  createChartAreas();

  loadSales();

  loadDeposits();

  loadProfitSales();

  loadSavedMonthlyProfit();

</script>
