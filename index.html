<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>더 타코부스 경영관리</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 24px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .amount {
      font-size: 28px;
      font-weight: bold;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .channel {
      font-weight: 600;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .error {
      background: #fff0f0;
      color: #c62828;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    @media (max-width: 700px) {
      .container {
        padding: 16px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .amount {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>더 타코부스 경영관리</h1>
  <div class="subtitle">매장 운영 현황</div>

  <div id="loading" class="loading">
    매출 데이터를 불러오는 중...
  </div>

  <div id="error" class="error" style="display:none;"></div>

  <div id="dashboard" style="display:none;">

    <div class="cards">

      <div class="card">
        <div class="card-title">오늘 매출</div>
        <div class="amount" id="todaySales">0원</div>
      </div>

      <div class="card">
        <div class="card-title">8월 누적 매출</div>
        <div class="amount" id="monthlySales">0원</div>
      </div>

      <div class="card">
        <div class="card-title">매출 건수</div>
        <div class="amount" id="salesCount">0건</div>
      </div>

    </div>

    <div class="section">

      <h2 id="latestTitle">최근 매출</h2>

      <div id="salesList"></div>

      <div class="row total">
        <span>총매출</span>
        <span id="totalSales">0원</span>
      </div>

    </div>

    <div class="section">

      <h2>매출 채널별 분석</h2>

      <div id="channelList"></div>

  <div class="section">
  <h2>정산 관리</h2>

  <div id="depositList"></div>

  <div class="row total">
    <span>총 입금액</span>
    <span id="totalDeposit">0원</span>
  </div>

  <div class="row total">
    <span>총 수수료</span>
    <span id="totalFee">0원</span>
  </div>
</div>

</div>

<script>

  // ==============================
  // Supabase 연결 정보
  // ==============================

  const SUPABASE_URL =
    "https://gvlfyzdswegwmmpzoabc.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Inp1yZHn3Qrqtzq1TWgUaw_AWxEgK5y";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ==============================
  // 숫자를 원화로 표시
  // ==============================

  function won(number) {
    return Number(number).toLocaleString("ko-KR") + "원";
  }


  // ==============================
  // 매출 데이터 불러오기
  // ==============================

  async function loadSales() {

    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const dashboard = document.getElementById("dashboard");

    try {

      const { data, error } = await supabaseClient
        .from("sales")
        .select("*")
        .order("sale_date", { ascending: false })
        .order("id", { ascending: false });

      if (error) {
        throw error;
      }

      if (!data || data.length === 0) {
        throw new Error("등록된 매출 데이터가 없습니다.");
      }


      // ==============================
      // 전체 매출
      // ==============================

      const total = data.reduce(
        (sum, row) => sum + Number(row.amount),
        0
      );


      // ==============================
      // 오늘 매출
      // ==============================

      const today = new Date()
        .toISOString()
        .split("T")[0];

      const todayTotal = data
        .filter(row => row.sale_date === today)
        .reduce(
          (sum, row) => sum + Number(row.amount),
          0
        );


      // ==============================
      // 화면 숫자 표시
      // ==============================

      document.getElementById("todaySales").textContent =
        won(todayTotal);

      document.getElementById("monthlySales").textContent =
        won(total);

      document.getElementById("totalSales").textContent =
        won(total);

      document.getElementById("salesCount").textContent =
        data.length + "건";


      // ==============================
      // 최근 매출
      // ==============================

      const salesList =
        document.getElementById("salesList");

      salesList.innerHTML = "";

      data.slice(0, 20).forEach(row => {

        const div = document.createElement("div");

        div.className = "row";

        div.innerHTML = `
          <span>
            <strong>${row.channel}</strong>
            <br>
            <small>${row.sale_date}</small>
          </span>

          <strong>${won(row.amount)}</strong>
        `;

        salesList.appendChild(div);

      });


      // ==============================
      // 채널별 매출
      // ==============================

      const channels = {};

      data.forEach(row => {

        if (!channels[row.channel]) {
          channels[row.channel] = 0;
        }

        channels[row.channel] += Number(row.amount);

      });


      const channelList =
        document.getElementById("channelList");

      channelList.innerHTML = "";

      Object.entries(channels)
        .sort((a, b) => b[1] - a[1])
        .forEach(([channel, amount]) => {

          const percentage =
            total > 0
              ? ((amount / total) * 100).toFixed(1)
              : 0;

          const div =
            document.createElement("div");

          div.className = "row";

          div.innerHTML = `
            <span>${channel}</span>
            <strong>
              ${won(amount)}
              (${percentage}%)
            </strong>
          `;

          channelList.appendChild(div);

        });


      loading.style.display = "none";
      dashboard.style.display = "block";

    } catch (error) {

      console.error(error);

      loading.style.display = "none";

      errorBox.style.display = "block";

      errorBox.textContent =
        "매출 데이터를 불러오지 못했습니다: " +
        error.message;

    }

  }


  loadSales();
 async function loadDeposits() {
  const depositList = document.getElementById("depositList");
  const totalDeposit = document.getElementById("totalDeposit");
  const totalFee = document.getElementById("totalFee");

  try {
    const { data, error } = await supabaseClient
      .from("deposit_details")
      .select("*")
      .order("deposit_date", { ascending: false })
      .order("id", { ascending: false });

    if (error) {
      throw error;
    }

    if (!data || data.length === 0) {
      depositList.innerHTML = "<p>등록된 정산 데이터가 없습니다.</p>";
      totalDeposit.textContent = "0원";
      totalFee.textContent = "0원";
      return;
    }

    let depositSum = 0;
    let feeSum = 0;

    depositList.innerHTML = data.map(item => {

      const totalDeductions =
        Number(item.brokerage_fee || 0) +
        Number(item.delivery_fee || 0) +
        Number(item.coupon_discount || 0) +
        Number(item.instant_discount || 0) +
        Number(item.advertising_fee || 0) +
        Number(item.payment_fee || 0) +
        Number(item.vat_1 || 0);

      const adjustments =
        Number(item.fee_adjustment || 0) +
        Number(item.vat_2_adjustment || 0);

      const actualFee = totalDeductions - adjustments;

      depositSum += Number(item.deposit_amount || 0);
      feeSum += actualFee;

      const settlementRate =
        Number(item.sales_amount || 0) > 0
          ? (Number(item.deposit_amount || 0) / Number(item.sales_amount || 0) * 100).toFixed(1)
          : "0.0";

      return `
        <div class="row" style="padding:18px 0;border-bottom:1px solid #eee;">
          <div>
            <strong>${item.channel}</strong>
            <div style="font-size:13px;color:#777;">
              ${item.deposit_date}
            </div>

            <div style="margin-top:10px;font-size:13px;line-height:1.8;color:#555;">
              매출 ${won(item.sales_amount)} ·
              중개 ${won(item.brokerage_fee)} ·
              배달비 ${won(item.delivery_fee)}<br>

              쿠폰 ${won(item.coupon_discount)} ·
              즉시할인 ${won(item.instant_discount)} ·
              광고비 ${won(item.advertising_fee)}<br>

              결제수수료 ${won(item.payment_fee)} ·
              부가세 ${won(item.vat_1)}<br>

              수수료 보정 ${won(item.fee_adjustment)} ·
              부가세 보정 ${won(item.vat_2_adjustment)}
            </div>
          </div>

          <div style="text-align:right;margin-top:10px;">
            <strong>${won(item.deposit_amount)}</strong>

            <div style="font-size:13px;color:#777;">
              매출 ${won(item.sales_amount)}
            </div>

            <div style="font-size:13px;color:#777;">
              실제 정산율 ${settlementRate}%
            </div>

            <div style="font-size:13px;color:#777;">
              실제 차감액 ${won(actualFee)}
            </div>
          </div>
        </div>
      `;
    }).join("");

    totalDeposit.textContent = won(depositSum);
    totalFee.textContent = won(feeSum);

  } catch (error) {
    console.error(error);

    depositList.innerHTML =
      `<p style="color:red;">정산 데이터를 불러오지 못했습니다: ${error.message}</p>`;

    totalDeposit.textContent = "0원";
    totalFee.textContent = "0원";
  }
}

loadSales();
loadDeposits();

</script>

</body>
</html>
